<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할일</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>오늘의 할일</h1>
      <p id="today" class="app__date"></p>
      <div id="progress-track" class="progress" role="progressbar" aria-label="오늘의 진행률"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="progress__bar"></div>
      </div>
      <p id="progress-text" class="progress__text"></p>
      <p id="celebrate" class="celebrate" hidden>🎉 오늘 할일을 모두 끝냈어요!</p>
    </header>

    <div id="storage-warning" class="banner banner--warn" role="alert" hidden>
      브라우저 저장소를 사용할 수 없어 새로고침하면 할일이 사라집니다.
    </div>

    <div id="carry-banner" class="banner" role="status" hidden>
      <span id="carry-text"></span>
      <div class="banner__actions">
        <button type="button" id="carry-accept" class="btn btn--primary">오늘로 가져오기</button>
        <button type="button" id="carry-discard" class="btn">버리기</button>
      </div>
    </div>

    <form id="todo-form" class="composer" autocomplete="off" novalidate>
      <div class="composer__row">
        <input id="new-todo" class="composer__input" type="text" maxlength="100"
               placeholder="할 일을 입력하세요..." aria-label="새 할일" aria-describedby="char-count">
        <button type="submit" class="btn btn--primary">추가</button>
      </div>
      <div class="composer__meta">
        <fieldset class="priority-picker">
          <legend>우선순위</legend>
          <label><input type="radio" name="priority" value="high"> 높음</label>
          <label><input type="radio" name="priority" value="medium" checked> 보통</label>
          <label><input type="radio" name="priority" value="low"> 낮음</label>
        </fieldset>
        <span id="char-count" class="char-count">0 / 100</span>
      </div>
    </form>

    <nav class="filters" role="tablist" aria-label="할일 필터">
      <button type="button" role="tab" data-filter="all">전체</button>
      <button type="button" role="tab" data-filter="active">진행 중</button>
      <button type="button" role="tab" data-filter="completed">완료</button>
    </nav>

    <section class="list-area">
      <ul id="todo-list" class="todo-list" aria-label="할일 목록"></ul>
      <div id="empty" class="empty" hidden>
        <span class="empty__icon" aria-hidden="true">📝</span>
        <p id="empty-text"></p>
      </div>
    </section>

    <footer class="app__footer">
      <span id="remaining"></span>
      <button type="button" id="clear-completed" class="btn btn--ghost">완료 항목 지우기</button>
    </footer>

    <p class="hint">단축키: <kbd>/</kbd> 입력창 · <kbd>Space</kbd> 완료 · <kbd>Delete</kbd> 삭제 · 더블클릭 수정</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo" class="toast__undo">실행 취소</button>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
